<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Для тебе</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;
            min-height: 100dvh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            overflow-x: hidden;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            position: relative;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,0.18),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 85% 75%,
                    rgba(255,120,180,0.15),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #1b1027,
                    #421d3e,
                    #702f55,
                    #25152e
                );
        }


        /* =====================================================
           ФОНОВІ ЧАСТИНКИ
        ===================================================== */

        #particles {

            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 1;
        }

        .background-particle {

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.35);

            animation:
                floatParticle
                linear
                infinite;
        }

        @keyframes floatParticle {

            from {

                transform:
                    translateY(110vh)
                    translateX(0);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            to {

                transform:
                    translateY(-10vh)
                    translateX(80px);

                opacity: 0;
            }
        }


        /* =====================================================
           ГОЛОВНИЙ КОНТЕЙНЕР
        ===================================================== */

        .container {

            width: 100%;

            max-width: 850px;

            min-height: 650px;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

            z-index: 5;
        }


        /* =====================================================
           BOOT SCREEN
        ===================================================== */

        .boot-screen {

            width: min(760px, 94vw);

            min-height: 420px;

            padding: 28px;

            border:
                1px solid
                rgba(95, 220, 255, 0.28);

            border-radius: 18px;

            background:
                rgba(5, 10, 18, 0.78);

            box-shadow:

                0 30px 80px
                rgba(0,0,0,0.45),

                inset
                0 0 50px
                rgba(0,180,255,0.035);

            backdrop-filter:
                blur(14px);

            font-family:
                "Courier New",
                Consolas,
                monospace;

            position: relative;

            overflow: hidden;

            animation:
                bootAppear
                0.8s
                ease;
        }

        @keyframes bootAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.97)
                    translateY(15px);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }

        .boot-screen::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    transparent 50%,
                    rgba(255,255,255,0.018) 50%
                );

            background-size:
                100% 4px;

            pointer-events: none;

            opacity: 0.35;
        }


        /* =====================================================
           BOOT HEADER
        ===================================================== */

        .boot-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 25px;

            padding-bottom: 15px;

            border-bottom:
                1px solid
                rgba(95,220,255,0.16);

            position: relative;

            z-index: 2;
        }

        .boot-logo {

            color:
                #64d9ff;

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 1px;

            text-shadow:
                0 0 12px
                rgba(80,210,255,0.5);
        }

        .boot-status {

            color:
                #6ee7a8;

            font-size: 12px;

            letter-spacing: 1px;
        }


        /* =====================================================
           BOOT TERMINAL
           
           ГОЛОВНА ЗМІНА:
           термінал має власну область прокрутки.
        ===================================================== */

        .boot-terminal {

            position: relative;

            z-index: 2;

            height: 250px;

            /*
             * ВАЖЛИВО:
             * тепер текст прокручується всередині
             * цього блоку, а не виходить вниз.
             */

            overflow-y: auto;

            overflow-x: hidden;

            display: flex;

            flex-direction: column;

            justify-content: flex-start;

            /*
             * Прибираємо видиму смугу прокрутки.
             */

            scrollbar-width: none;

            scroll-behavior: smooth;
        }


        /*
         * Chrome / Edge / Safari
         */

        .boot-terminal::-webkit-scrollbar {
            display: none;
        }


        /* =====================================================
           BOOT LINES
        ===================================================== */

        .boot-line {

            min-height: 27px;

            line-height: 27px;

            color:
                rgba(220,240,248,0.88);

            font-size:
                clamp(
                    12px,
                    2vw,
                    15px
                );

            white-space: pre-wrap;

            word-break: break-word;

            /*
             * Рядки не стискаються.
             */

            flex-shrink: 0;

            opacity: 0;

            transform:
                translateY(5px);

            animation:
                bootLineAppear
                0.25s
                ease
                forwards;
        }

        @keyframes bootLineAppear {

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /*
         * Кольори рядків
         */

        .boot-line .command {
            color:
                #64d9ff;
        }

        .boot-line .success {
            color:
                #6ee7a8;
        }

        .boot-line .warning {
            color:
                #ffd166;
        }

        .boot-line .pink {
            color:
                #ff78b7;
        }


        /* =====================================================
           КУРСОР ДРУКУ
        ===================================================== */

        .boot-cursor {

            display: inline-block;

            width: 8px;

            height: 15px;

            margin-left: 4px;

            background:
                #64d9ff;

            vertical-align: -2px;

            animation:
                cursorBlink
                0.8s
                steps(1)
                infinite;
        }

        @keyframes cursorBlink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }


        /* =====================================================
           BOOT PROGRESS
           ФІКСОВАНА ВИСОТА — НІЧОГО НЕ СКАЧЕ
        ===================================================== */

        .boot-progress-area {

            position: absolute;

            left: 28px;

            right: 28px;

            bottom: 22px;

            height: 55px;

            z-index: 3;
        }

        .boot-progress-info {

            height: 22px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            font-family:
                "Courier New",
                Consolas,
                monospace;

            font-size: 12px;
        }

        .boot-progress-label {

            color:
                rgba(255,255,255,0.5);

            white-space: nowrap;
        }

        .boot-percent {

            width: 45px;

            height: 22px;

            line-height: 22px;

            text-align: right;

            color:
                #64d9ff;

            font-weight: bold;

            font-variant-numeric:
                tabular-nums;

            flex-shrink: 0;
        }

        .boot-progress {

            width: 100%;

            height: 7px;

            margin-top: 7px;

            border-radius: 10px;

            overflow: hidden;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(100,217,255,0.15);
        }

        .boot-progress-bar {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:

                linear-gradient(
                    90deg,
                    #287da5,
                    #64d9ff,
                    #6ee7a8
                );

            box-shadow:
                0 0 14px
                rgba(80,210,255,0.55);

            transition:
                width 0.12s linear;
        }


        /* =====================================================
           START SCREEN
        ===================================================== */

        .start-screen {

            width: 100%;

            max-width: 500px;

            text-align: center;

            animation:
                startAppear
                1s
                ease;
        }

        @keyframes startAppear {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.96);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .start-title {

            font-size:
                clamp(
                    28px,
                    6vw,
                    44px
                );

            margin-bottom: 15px;

            text-shadow:
                0 4px 20px
                rgba(0,0,0,0.35);
        }

        .start-text {

            font-size: 17px;

            line-height: 1.5;

            opacity: 0.85;

            margin-bottom: 30px;
        }

        .date-input {

            width: 100%;

            padding:
                16px 18px;

            border:
                2px solid
                rgba(255,255,255,0.25);

            border-radius: 15px;

            background:
                rgba(255,255,255,0.10);

            color: white;

            font-size: 18px;

            text-align: center;

            outline: none;

            backdrop-filter:
                blur(10px);

            transition:
                0.3s;
        }

        .date-input::placeholder {

            color:
                rgba(255,255,255,0.55);
        }

        .date-input:focus {

            border-color:
                rgba(255,255,255,0.65);

            background:
                rgba(255,255,255,0.15);

            box-shadow:
                0 0 25px
                rgba(255,255,255,0.12);
        }

        .start-button {

            width: 100%;

            margin-top: 15px;

            padding: 16px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #4fb3d8,
                    #216b91
                );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.25);

            transition:
                0.25s;
        }

        .start-button:hover {

            transform:
                translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    #65c5e7,
                    #287da5
                );

            box-shadow:
                0 14px 35px
                rgba(0,0,0,0.35);
        }

        .start-button:active {

            transform:
                scale(0.97);
        }

        .error {

            margin-top: 15px;

            color:
                #ff9fbd;

            font-size: 15px;

            min-height: 20px;
        }


        /* =====================================================
           КОНВЕРТ
        ===================================================== */

        .envelope-wrapper {

            width:
                min(
                    500px,
                    90vw
                );

            height: 330px;

            position: relative;

            perspective:
                1400px;

            perspective-origin:
                50% 45%;

            cursor: pointer;
        }

        .envelope {

            width: 100%;

            height: 100%;

            position: relative;

            transform-style:
                preserve-3d;

            transform:
                translateZ(0)
                rotateX(0deg)
                rotateY(0deg);

            filter:
                drop-shadow(
                    0 32px 25px
                    rgba(0,0,0,0.48)
                )
                drop-shadow(
                    0 12px 12px
                    rgba(0,0,0,0.28)
                );

            transition:
                transform
                1.2s
                cubic-bezier(
                    .2,
                    .8,
                    .2,
                    1
                );
        }

        .envelope::before {

            content: "";

            position: absolute;

            left: 2%;
            top: 8%;

            width: 96%;
            height: 86%;

            border-radius:
                18px 18px 15px 15px;

            background:

                radial-gradient(
                    ellipse at 50% 12%,
                    rgba(38,105,138,0.18),
                    transparent 38%
                ),

                linear-gradient(
                    160deg,
                    #173d56 0%,
                    #12334a 35%,
                    #0d293e 65%,
                    #071a2a 100%
                );

            box-shadow:

                inset
                0 8px 18px
                rgba(0,0,0,0.72),

                inset
                0 -15px 25px
                rgba(0,0,0,0.62),

                inset
                0 0 30px
                rgba(0,0,0,0.42),

                0 0 0 2px
                rgba(3,24,40,0.95);

            transform:
                translateZ(-15px);

            z-index: 0;
        }

        .envelope::after {

            content: "";

            position: absolute;

            left: 2%;

            bottom: 3%;

            width: 96%;

            height: 10px;

            border-radius: 50%;

            background:
                rgba(4,25,42,0.65);

            filter:
                blur(5px);

            transform:
                translateZ(-18px);

            z-index: 0;
        }

        .envelope.opened {

            transform:
                translateY(20px)
                translateZ(0)
                scale(0.92)
                rotateX(0deg);
        }

        .envelope-body {

            position: absolute;

            left: 0;
            top: 5%;

            width: 100%;
            height: 90%;

            background:

                linear-gradient(
                    145deg,
                    #294f65 0%,
                    #1d4258 28%,
                    #14364b 55%,
                    #0d2a3d 78%,
                    #071d2d 100%
                );

            border-radius:
                14px 14px 18px 18px;

            overflow: hidden;

            border:
                4px solid
                #061f31;

            box-shadow:

                inset
                0 4px 0
                rgba(100,180,210,0.10),

                inset
                0 12px 20px
                rgba(0,0,0,0.55),

                inset
                0 -25px 38px
                rgba(0,0,0,0.58),

                inset
                0 0 30px
                rgba(0,0,0,0.38),

                0 12px 18px
                rgba(0,0,0,0.32);

            transform:
                translateZ(-5px);

            z-index: 1;
        }

        .envelope-body::before {

            content: "";

            position: absolute;

            inset: 0;

            background:

                linear-gradient(
                    90deg,
                    rgba(0,12,22,0.25),
                    transparent 25%,
                    transparent 75%,
                    rgba(0,12,22,0.32)
                ),

                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.12),
                    transparent 25%,
                    rgba(0,0,0,0.22)
                );

            pointer-events: none;
        }

        .envelope-body::after {

            content: "";

            position: absolute;

            left: -20%;

            top: -30%;

            width: 55%;

            height: 160%;

            background:

                linear-gradient(
                    100deg,
                    transparent,
                    rgba(100,180,210,0.055),
                    transparent
                );

            transform:
                rotate(12deg);

            opacity: 0.4;

            pointer-events: none;
        }

        .envelope-left {

            position: absolute;

            left: 0;
            bottom: 5%;

            width: 52%;
            height: 85%;

            background:

                linear-gradient(
                    135deg,
                    #d8f5fd 0%,
                    #9bcfe2 25%,
                    #4d9ab9 53%,
                    #246b8b 76%,
                    #103c59 100%
                );

            clip-path:
                polygon(
                    0 0,
                    100% 100%,
                    0 100%
                );

            filter:

                drop-shadow(
                    4px -2px 3px
                    rgba(255,255,255,0.28)
                )

                drop-shadow(
                    5px 5px 6px
                    rgba(2,25,43,0.48)
                )

                drop-shadow(
                    2px 0 2px
                    rgba(3,28,47,0.90)
                );

            transform:
                translateZ(13px);

            transform-style:
                preserve-3d;

            z-index: 3;
        }

        .envelope-left::before {

            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.30),
                    rgba(255,255,255,0.06) 30%,
                    transparent 47%,
                    rgba(4,45,70,0.22) 72%,
                    rgba(3,27,45,0.34)
                );

            clip-path:
                polygon(
                    0 0,
                    100% 100%,
                    0 100%
                );

            pointer-events: none;
        }

        .envelope-left::after {

            content: "";

            position: absolute;

            left: 2%;

            top: -1%;

            width: 7px;

            height: 111%;

            background:

                linear-gradient(
                    to bottom,
                    #092f48 0%,
                    #06273d 30%,
                    #041f32 60%,
                    #092f48 82%,
                    transparent 100%
                );

            transform:
                rotate(-45deg);

            transform-origin:
                top center;

            filter:
                drop-shadow(
                    1px 2px 2px
                    rgba(0,0,0,0.75)
                );

            opacity: 1;

            pointer-events: none;
        }

        .envelope-right {

            position: absolute;

            right: 0;
            bottom: 5%;

            width: 52%;
            height: 85%;

            background:

                linear-gradient(
                    225deg,
                    #e9faff 0%,
                    #b9e4f1 30%,
                    #66aec9 60%,
                    #286b89 80%,
                    #103d59 100%
                );

            clip-path:
                polygon(
                    100% 0,
                    100% 100%,
                    0 100%
                );

            filter:

                drop-shadow(
                    -4px -2px 3px
                    rgba(255,255,255,0.30)
                )

                drop-shadow(
                    -5px 5px 6px
                    rgba(3,27,47,0.45)
                )

                drop-shadow(
                    -2px 0 2px
                    rgba(3,28,47,0.88)
                );

            transform:
                translateZ(14px);

            transform-style:
                preserve-3d;

            z-index: 3;
        }

        .envelope-right::before {

            content: "";

            position: absolute;

            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            background:

                linear-gradient(
                    225deg,
                    rgba(255,255,255,0.46),
                    rgba(255,255,255,0.08) 34%,
                    transparent 52%,
                    rgba(4,45,70,0.20) 76%,
                    rgba(3,28,46,0.30)
                );

            clip-path:
                polygon(
                    100% 0,
                    100% 100%,
                    0 100%
                );

            pointer-events: none;
        }

        .envelope-right::after {

            content: "";

            position: absolute;

            right: 2%;

            top: -1%;

            width: 7px;

            height: 111%;

            background:

                linear-gradient(
                    to bottom,
                    #092f48 0%,
                    #06273d 30%,
                    #041f32 60%,
                    #092f48 82%,
                    transparent 100%
                );

            transform:
                rotate(45deg);

            transform-origin:
                top center;

            filter:
                drop-shadow(
                    -1px 2px 2px
                    rgba(0,0,0,0.75)
                );

            opacity: 1;

            pointer-events: none;
        }

        .envelope-bottom {

            position: absolute;

            left: 0;
            bottom: 5%;

            width: 100%;

            height: 73%;

            background:

                linear-gradient(
                    165deg,
                    #e6faff 0%,
                    #b9e3ef 23%,
                    #78b8d0 48%,
                    #3c809f 75%,
                    #174b67 100%
                );

            clip-path:
                polygon(
                    0 100%,
                    50% 24%,
                    100% 100%
                );

            filter:

                drop-shadow(
                    0 -3px 2px
                    rgba(255,255,255,0.32)
                )

                drop-shadow(
                    0 8px 10px
                    rgba(3,28,48,0.40)
                );

            transform:
                translateZ(24px);

            transform-style:
                preserve-3d;

            z-index: 4;
        }

        .envelope-bottom::before {

            content: "";

            position: absolute;

            left: 50%;

            top: 20%;

            width: 8px;

            height: 80%;

            background:

                linear-gradient(
                    to bottom,
                    #05283f 0%,
                    #031d30 40%,
                    #082f49 72%,
                    rgba(8,47,70,0.65) 88%,
                    transparent 100%
                );

            transform:
                translateX(-50%);

            filter:
                drop-shadow(
                    0 1px 2px
                    rgba(0,0,0,0.80)
                );

            z-index: 2;
        }

        .envelope-bottom::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: 0;

            width: 100%;

            height: 25%;

            background:

                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(3,28,47,0.42)
                );

            pointer-events: none;
        }

        .envelope-flap {

            position: absolute;

            top: 5%;
            left: 0;

            width: 100%;

            height: 66%;

            background:

                linear-gradient(
                    145deg,
                    #f7fdff 0%,
                    #def6fc 20%,
                    #a5d8e8 47%,
                    #4c94b2 73%,
                    #174964 100%
                );

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    50% 100%
                );

            transform-origin:
                top center;

            transform:
                translateZ(35px)
                rotateX(0deg);

            transform-style:
                preserve-3d;

            transition:

                transform
                1.15s
                cubic-bezier(
                    .18,
                    .82,
                    .2,
                    1
                );

            backface-visibility:
                visible;

            box-shadow:

                inset
                0 2px 0
                rgba(255,255,255,1),

                inset
                0 8px 14px
                rgba(255,255,255,0.52),

                inset
                0 -10px 18px
                rgba(5,55,82,0.36);

            filter:

                drop-shadow(
                    0 7px 5px
                    rgba(3,27,48,0.40)
                )

                drop-shadow(
                    0 0 2px
                    rgba(3,25,42,0.90)
                );

            z-index: 6;

            border-radius:
                12px 12px 0 0;
        }

        .envelope-flap::before {

            content: "";

            position: absolute;

            left: -15%;

            top: -25%;

            width: 70%;

            height: 150%;

            background:

                linear-gradient(
                    105deg,
                    transparent 25%,
                    rgba(255,255,255,0.40) 48%,
                    transparent 65%
                );

            transform:
                rotate(8deg);

            pointer-events: none;
        }

        .envelope-flap::after {

            content: "";

            position: absolute;

            left: 50%;

            top: 0;

            width: 7px;

            height: 102%;

            background:

                linear-gradient(
                    to bottom,
                    #062940 0%,
                    #031e31 22%,
                    #05283f 52%,
                    #082f48 76%,
                    transparent 100%
                );

            transform:
                translateX(-50%);

            opacity: 1;

            filter:
                drop-shadow(
                    1px 1px 2px
                    rgba(0,0,0,0.75)
                );
        }

        .envelope.opened
        .envelope-flap {

            transform:
                translateZ(35px)
                rotateX(180deg);

            z-index: 1;
        }

        .wax-seal {

            position: absolute;

            left: 50%;
            top: 48%;

            transform:
                translate(
                    -50%,
                    -50%
                )
                translateZ(55px);

            width: 58px;
            height: 58px;

            background:

                radial-gradient(
                    circle at 30% 25%,
                    #62a789 0%,
                    #34755d 18%,
                    #1b4d3e 43%,
                    #0b291f 78%,
                    #061b14 100%
                );

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

            box-shadow:

                0 10px 15px
                rgba(0,0,0,0.42),

                0 4px 0
                #09271e,

                0 0 0 3px
                rgba(11,41,31,0.9),

                0 0 0 5px
                rgba(255,255,255,0.13),

                inset
                0 4px 6px
                rgba(255,255,255,0.25),

                inset
                0 -7px 10px
                rgba(0,0,0,0.35);

            border:
                2px solid
                #143d31;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

            user-select: none;

            z-index: 10;
        }

        .wax-seal::before {

            content: "";

            position: absolute;

            inset: 5px;

            border:
                1px solid
                rgba(255,255,255,0.18);

            border-radius: 50%;

            box-shadow:

                inset
                0 1px 2px
                rgba(255,255,255,0.15),

                inset
                0 -2px 3px
                rgba(0,0,0,0.25);
        }

        .wax-seal::after {

            content: "";

            position: absolute;

            left: 10px;
            top: 8px;

            width: 18px;
            height: 11px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.18);

            filter:
                blur(3px);

            transform:
                rotate(-25deg);
        }

        .wax-seal:hover {

            transform:
                translate(
                    -50%,
                    -50%
                )
                translateZ(55px)
                scale(1.07);
        }

        .wax-seal:active {

            transform:
                translate(
                    -50%,
                    -50%
                )
                translateZ(55px)
                scale(0.95);
        }

        .envelope.opened
        .wax-seal {

            opacity: 0;

            transform:
                translate(
                    -50%,
                    -50%
                )
                translateZ(55px)
                scale(0.4);
        }

        .envelope-wrapper::before {

            content: "";

            position: absolute;

            left: 5%;

            bottom: -18px;

            width: 90%;

            height: 30px;

            border-radius: 50%;

            background:
                rgba(0,0,0,0.32);

            filter:
                blur(15px);

            transform:
                translateZ(-30px);

            pointer-events: none;
        }

        .click-hint {

            position: absolute;

            bottom: -65px;

            width: 100%;

            text-align: center;

            font-size: 16px;

            opacity: 0.75;

            animation:
                hintPulse
                1.8s
                ease-in-out
                infinite;
        }

        @keyframes hintPulse {

            0%,
            100% {
                opacity: 0.45;
            }

            50% {
                opacity: 1;
            }
        }


        /* =====================================================
           ЛИСТ
        ===================================================== */

        .letter {

            position: absolute;

            width:
                min(
                    680px,
                    92vw
                );

            max-height: 90vh;
            max-height: 90dvh;

            background:
                linear-gradient(
                    145deg,
                    #fffafc,
                    #fff0f6
                );

            color:
                #351d2d;

            border-radius: 18px;

            padding:
                35px 40px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.4);

            opacity: 0;

            transform:
                translateY(100px)
                scale(0.8);

            pointer-events: none;

            transition:
                opacity 0.9s ease,
                transform
                1s
                cubic-bezier(
                    .2,
                    .8,
                    .2,
                    1
                );

            z-index: 20;

            overflow-y: auto;

            overflow-x: hidden;

            scrollbar-width: thin;

            scroll-behavior: smooth;
        }

        .letter.show {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

            pointer-events: auto;
        }

        .letter::before {

            content: "";

            position: absolute;

            inset: 0;

            background:

                radial-gradient(
                    circle at 20% 20%,
                    rgba(
                        255,
                        150,
                        190,
                        0.12
                    ),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(
                        255,
                        100,
                        160,
                        0.08
                    ),
                    transparent 30%
                );

            pointer-events: none;
        }

        .letter-header {

            position: relative;

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 30px;

            color:
                #8c315f;
        }

        .text-area {

            position: relative;

            width: 100%;

            min-height: auto;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            text-align: center;

            padding:
                10px 5px;
        }

        .letter-line {

            width: 100%;

            font-size:
                clamp(
                    18px,
                    3.2vw,
                    22px
                );

            line-height: 1.5;

            font-weight: 500;

            margin-bottom: 17px;

            opacity: 0;

            transform:
                translateY(25px)
                scale(0.97);

            transition:
                opacity 0.9s ease,
                transform 0.9s ease;
        }

        .letter-line.visible {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }

        .controls {

            position: relative;

            display: flex;

            justify-content: center;

            margin-top: 20px;

            padding-top: 20px;

            border-top:
                1px solid
                rgba(
                    100,
                    40,
                    70,
                    0.12
                );

            transition:
                opacity 0.6s ease;
        }

        .button-row {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        .control-button {

            border: none;

            padding:
                11px 17px;

            border-radius: 12px;

            background:
                #f3d6e3;

            color:
                #713251;

            font-weight: bold;

            cursor: pointer;

            transition:
                0.2s;
        }

        .control-button:hover {

            background:
                #eabbd0;

            transform:
                translateY(-1px);
        }

        .control-button:active {

            transform:
                scale(0.96);
        }

        .photo-container {

            position: relative;

            width: 100%;

            margin-top: 15px;

            display: flex;

            justify-content: center;

            opacity: 0;

            transform:
                translateY(70px)
                scale(0.70)
                rotate(-5deg);

            transition:
                opacity 1.4s ease,
                transform
                1.4s
                cubic-bezier(
                    .2,
                    .8,
                    .2,
                    1
                );

            pointer-events: none;
        }

        .photo-container.show {

            opacity: 1;

            transform:
                translateY(0)
                scale(1)
                rotate(0);

            pointer-events: auto;
        }

        .photo-frame {

            position: relative;

            width:
                min(
                    420px,
                    100%
                );

            padding: 10px;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.28);

            animation:
                photoFloat
                4s
                ease-in-out
                infinite;
        }

        @keyframes photoFloat {

            0%,
            100% {

                transform:
                    rotate(-1deg)
                    translateY(0);
            }

            50% {

                transform:
                    rotate(1deg)
                    translateY(-5px);
            }
        }

        .photo-frame::before {

            content: "";

            position: absolute;

            inset: -8px;

            border-radius: 18px;

            border:
                1px solid
                rgba(
                    255,
                    120,
                    170,
                    0.35
                );

            animation:
                photoGlow
                2s
                ease-in-out
                infinite;
        }

        @keyframes photoGlow {

            0%,
            100% {
                opacity: 0.35;
            }

            50% {
                opacity: 1;
            }
        }

        .photo-frame img {

            display: block;

            width: 100%;

            max-height: 500px;

            object-fit: contain;

            border-radius: 8px;
        }

        .final-message {

            position: relative;

            text-align: center;

            margin-top: 25px;

            font-size: 20px;

            font-weight: bold;

            color:
                #8c315f;

            opacity: 0;

            transform:
                translateY(15px);

            transition:
                opacity 1s ease,
                transform 1s ease;
        }

        .final-message.show {

            opacity: 1;

            transform:
                translateY(0);
        }


        /* =====================================================
           SOUND BUTTON
        ===================================================== */

        .sound-button {

            position: fixed;

            top: 18px;

            right: 18px;

            width: 46px;

            height: 46px;

            border: none;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            color: white;

            font-size: 20px;

            cursor: pointer;

            backdrop-filter:
                blur(10px);

            z-index: 100;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.2);

            transition:
                0.2s;
        }

        .sound-button:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.2
                );

            transform:
                scale(1.05);
        }

        .hidden {
            display: none !important;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                min-height: 600px;
            }

            .boot-screen {

                min-height: 430px;

                padding: 20px;
            }

            .boot-header {
                margin-bottom: 18px;
            }

            .boot-terminal {
                height: 275px;
            }

            .boot-progress-area {

                left: 20px;

                right: 20px;

                bottom: 18px;
            }

            .boot-line {

                min-height: 28px;

                line-height: 28px;

            }

            .letter {

                width: 94vw;

                max-height: 88vh;
                max-height: 88dvh;

                min-height: auto;

                padding:
                    25px
                    18px
                    22px;
            }

            .letter-header {

                font-size: 24px;

                margin-bottom: 25px;
            }

            .text-area {
                min-height: auto;
            }

            .letter-line {

                font-size: 18px;

                line-height: 1.5;

                margin-bottom: 16px;
            }

            .envelope-wrapper {
                height: 270px;
            }

            .wax-seal {

                width: 50px;
                height: 50px;

                font-size: 24px;
            }

            .click-hint {

                bottom: -50px;

                font-size: 14px;
            }

            .control-button {

                padding:
                    10px 13px;

                font-size: 14px;
            }

            .final-message {

                font-size: 18px;

                line-height: 1.4;
            }
        }

    </style>

</head>


<body>


    <div id="particles"></div>


    <!-- =====================================================
         КНОПКА ЗВУКУ
    ====================================================== -->

    <button
        class="sound-button"
        id="soundButton"

        aria-label="Увімкнути або вимкнути звук"

    </button>


    <div class="container">


        <!-- =================================================
             BOOT SCREEN
        ================================================== -->

        <div

            id="bootScreen"
        >

            <div class="boot-header">

                <div class="boot-logo">

                </div>

                >

                </div>

            </div>


            <!--
                Термінал тепер має власну прокрутку.

            -->

            <!-- ФІКСОВАНА ПЛАШКА ПРОГРЕСУ -->

                    <div

                    </div>

                <div class="boot-progress">

        </div>


        <!-- =================================================

                <div class="button-row">

                    <button

    </div>


    <!-- =====================================================
         ЗВУКИ
    ====================================================== -->

    <audio
        id="bootTypingSound"
        preload="auto"
        loop
    >

        <source
            src="{{ url_for('static', filename='sounds/boot-typing.mp3') }}"
            type="audio/mpeg"
        >

    </audio>


    <audio
        id="envelopeSound"
        preload="auto"
    >

        <source
            src="{{ url_for('static', filename='sounds/envelope.mp3') }}"

        >

        id="typingSound"

    <audio
        id="finalSound"
        preload="auto"
    >

        <source
            src="{{ url_for('static', filename='sounds/final.mp3') }}"
            type="audio/mpeg"
        >

    </audio>


    <script>


        /* =====================================================
           BOOT SEQUENCE
        ===================================================== */

        const bootLines = [

            {
                text: "[BOOT] Initializing private access protocol...",
                type: "command"
            },

            {
                text: "[OK] Secure environment loaded.",
                type: "success"
            },

            {
                text: "[NET] Connecting to secure server...",
                type: "command"
            },

            {
                text: "[NET] Establishing encrypted connection...",
                type: "command"
            },

            {
                text: "[OK] Secure connection established.",
                type: "success"
            },

            {
                text: "[BIO] Scanning biometric signature...",
                type: "command"
            },

            {
                text: "[BIO] Eye pattern detected.",
                type: "success"
            },

            {
                text: "[SYS] Analyzing user profile...",
                type: "command"
            },

            {
                text: "[SYS] Cross-checking access permissions...",
                type: "command"
            },

            {
                text: "[WARN] Emotional vulnerability detected.",
                type: "warning"
            },

            {
                text: "[AI] Searching for positive memories...",
                type: "pink"
            },

            {
                text: "[AI] Access granted.",
                type: "success"
            },

            {
                text: "[SYSTEM] Preparing something special...",
                type: "pink"
            },

            {
                text: "[SYSTEM] Welcome, authorized user.",
                type: "success"
            }

        ];


        const bootScreen =
            document.getElementById(
                "bootScreen"
            );


        const bootTerminal =
            document.getElementById(
                "bootTerminal"
            );


        const bootPercent =
            document.getElementById(
                "bootPercent"
            );


        const bootProgressBar =
            document.getElementById(
                "bootProgressBar"
            );


        const bootStatus =
            document.getElementById(
                "bootStatus"
            );


        const bootTypingSound =
            document.getElementById(
                "bootTypingSound"
            );


        let soundsEnabled = true;


        /*
         * Швидкість друку одного символу.
         */

        const bootTypingSpeed = 24;


        /*
         * Пауза між рядками.
         */

        const bootLinePause = 260;


        /*
         * =====================================================
         * СТЕЖЕННЯ ЗА ТЕКСТОМ
         *
         * Ця функція прокручує ТІЛЬКИ bootTerminal.
         *
         * Тому:
         *
         * - старі рядки йдуть вгору;
         * - новий рядок завжди залишається видимим;
         * - прогрес унизу не рухається;
         * - вся сторінка не скаче.
         * =====================================================
         */

        function followBootText() {

            requestAnimationFrame(
                () => {

                    bootTerminal.scrollTop =
                        bootTerminal.scrollHeight;

                }
            );

        }


        /*
         * =====================================================
         * ДРУК ОДНОГО РЯДКА
         * =====================================================
         */

        async function typeBootLine(line) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "boot-line";


            bootTerminal.appendChild(
                element
            );


            const textSpan =
                document.createElement(
                    "span"
                );


            textSpan.className =
                line.type || "";


            element.appendChild(
                textSpan
            );


            const cursor =
                document.createElement(
                    "span"
                );


            cursor.className =
                "boot-cursor";


            element.appendChild(
                cursor
            );


            /*
             * Одразу показуємо новий рядок.
             */

            followBootText();


            /*
             * Друкуємо символ за символом.
             */

            for (
                let i = 0;
                i < line.text.length;
                i++
            ) {

                textSpan.textContent +=
                    line.text[i];


                /*
                 * Після кожного символу
                 * термінал стежить за останнім рядком.
                 */

                followBootText();


                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            bootTypingSpeed
                        )
                );

            }


            /*
             * Видаляємо курсор після
             * завершення друку.
             */

            cursor.remove();


            /*
             * Ще раз прокручуємо вниз,
             * щоб останній рядок точно залишився видимим.
             */

            followBootText();


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        bootLinePause
                    )
            );

        }


        /*
         * =====================================================
         * BOOT SEQUENCE
         * =====================================================
         */

        async function runBootSequence() {

            /*
             * Запускаємо звук набору.
             */

            playSound(
                "bootTypingSound"
            );


            for (
                let i = 0;
                i < bootLines.length;
                i++
            ) {

                await typeBootLine(
                    bootLines[i]
                );


                /*
                 * Прогрес рахується
                 * по завершених рядках.
                 */

                const progress =
                    Math.round(
                        (
                            (i + 1) /
                            bootLines.length
                        ) * 100
                    );


                updateBootProgress(
                    progress
                );

            }


            /*
             * Кінець boot-процесу.
             */

            stopSound(
                "bootTypingSound"
            );


            bootStatus.textContent =
                "ACCESS GRANTED";


            bootStatus.style.color =
                "#6ee7a8";


            /*
             * Маленька пауза після 100%.
             */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        800
                    )
            );


            /*
             * Плавне зникнення.
             */

            bootScreen.style.transition =
                "opacity 0.8s ease, transform 0.8s ease";


            bootScreen.style.opacity =
                "0";


            bootScreen.style.transform =
                "scale(0.96) translateY(-10px)";


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        800
                    )
            );


            bootScreen.classList.add(
                "hidden"
            );


            startScreen.classList.remove(
                "hidden"
            );

        }


        /*
         * =====================================================
         * ПРОГРЕС
         * =====================================================
         */

        function updateBootProgress(
            progress
        ) {

            /*
             * Ширина процентів ФІКСОВАНА.
             *
             * 1%
             * 10%
             * 100%
             *
             * нічого не рухають.
             */

            bootPercent.textContent =
                progress + "%";


            bootProgressBar.style.width =
                progress + "%";

        }


        /* =====================================================
           ЗВУК
        ===================================================== */

        function playSound(id) {

            if (!soundsEnabled) {
                return;
            }


            const audio =
                document.getElementById(id);


            if (!audio) {
                return;
            }


            try {

                audio.currentTime = 0;

                const promise =
                    audio.play();


                if (
                    promise !== undefined
                ) {

                    promise.catch(
                        () => {}
                    );

                }

            } catch (error) {

                console.log(
                    "Помилка звуку:",
                    error
                );

            }

        }


        function stopSound(id) {

            const audio =
                document.getElementById(id);


            if (!audio) {
                return;
            }


            try {

                audio.pause();

                audio.currentTime = 0;

            } catch (error) {

                console.log(error);

            }

        }


        function toggleSound() {

            soundsEnabled =
                !soundsEnabled;


            if (!soundsEnabled) {

                stopSound(
                    "bootTypingSound"
                );

                stopSound(
                    "envelopeSound"
                );

                stopSound(
                    "typingSound"
                );

                stopSound(
                    "photoSound"
                );

                stopSound(
                    "finalSound"
                );


                soundButton.textContent =
                    "🔇";

            } else {

                soundButton.textContent =
                    "🔊";


                /*
                 * Якщо boot ще триває,
                 * при повторному увімкненні
                 * повертаємо звук набору.
                 */

                if (
                    !bootScreen.classList.contains(
                        "hidden"
                    )
                ) {

                    playSound(
                        "bootTypingSound"
                    );

                }

            }

        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        function createParticles() {

            const particles =
                document.getElementById(
                    "particles"
                );


            for (
                let i = 0;
                i < 25;
                i++
            ) {

                const particle =
                    document.createElement(
                        "div"
                    );


                particle.className =
                    "background-particle";


                particle.style.left =
                    Math.random() * 100 + "%";


                particle.style.animationDuration =
                    (
                        8 +
                        Math.random() * 12
                    ) + "s";


                particle.style.animationDelay =
                    (
                        -Math.random() * 15
                    ) + "s";


                particle.style.opacity =
                    (
                        0.2 +
                        Math.random() * 0.5
                    );


                particles.appendChild(
                    particle
                );

            }

        }


        createParticles();


        /* =====================================================
           START
        ===================================================== */

        const startScreen =
            document.getElementById(
                "startScreen"
            );


        const dateInput =
            document.getElementById(
                "dateInput"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        const envelopeWrapper =
            document.getElementById(
                "envelopeWrapper"
            );


        const envelope =
            document.getElementById(
                "envelope"
            );


        const letter =
            document.getElementById(
                "letter"
            );


        const textArea =
            document.getElementById(
                "textArea"
            );


        const photoContainer =
            document.getElementById(
                "photoContainer"
            );


        const finalMessage =
            document.getElementById(
                "finalMessage"
            );


        const controls =
            document.getElementById(
                "controls"
            );


        const pauseButton =
            document.getElementById(
                "pauseButton"
            );


        const soundButton =
            document.getElementById(
                "soundButton"
            );


        /* =====================================================
           BOOT ЗАПУСКАЄТЬСЯ ПЕРШИМ
        ===================================================== */

        window.addEventListener(
            "load",
            () => {

                setTimeout(
                    () => {

                        runBootSequence();

                    },
                    500
                );

            }
        );


        /* =====================================================
           ПЕРЕВІРКА ДАТИ
        ===================================================== */

        async function checkDate() {

            const entered =
                dateInput.value
                    .trim()
                    .toLowerCase();


            if (!entered) {

                errorMessage.textContent =
                    "Введи дату 😏";

                return;

            }


            try {

                const response =
                    await fetch(
                        "/check-date",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    date: entered
                                })

                        }
                    );


                const result =
                    await response.json();


                if (
                    result.success
                ) {

                    errorMessage.textContent =
                        "";


                    startScreen.classList.add(
                        "hidden"
                    );


                    envelopeWrapper.classList.remove(
                        "hidden"
                    );


                    envelopeWrapper.style.animation =
                        "startAppear 1s ease";

                } else {

                    errorMessage.textContent =
                        result.message ||
                        "Дата неправильна 😏";


                    dateInput.classList.add(
                        "shake"
                    );


                    setTimeout(
                        () => {

                            dateInput.classList.remove(
                                "shake"
                            );

                        },
                        500
                    );

                }


            } catch (error) {

                console.error(
                    error
                );


                errorMessage.textContent =
                    "Щось пішло не так. Спробуй ще раз.";

            }

        }


        dateInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    checkDate();

                }

            }
        );


        /* =====================================================
           КОНВЕРТ
        ===================================================== */

        let isEnvelopeOpened = false;


        function openEnvelope() {

            if (
                isEnvelopeOpened
            ) {

                return;

            }


            isEnvelopeOpened = true;


            playSound(
                "envelopeSound"
            );


            envelope.classList.add(
                "opened"
            );


            setTimeout(
                () => {

                    envelopeWrapper.classList.add(
                        "hidden"
                    );


                    letter.classList.remove(
                        "hidden"
                    );


                    letter.scrollTop = 0;


                    requestAnimationFrame(
                        () => {

                            letter.classList.add(
                                "show"
                            );

                        }
                    );

                },
                1200
            );


            setTimeout(
                () => {

                    startText();

                },
                2200
            );

        }


        /* =====================================================
           ТЕКСТ ЛИСТА
        ===================================================== */

        const letterLines = [

            "Я бачу, що тобі може бути важко: робота, навчання, допомога по дому, дорога і купа всього іншого.",

            "Знаю, як буває важко, коли дуже багато всього накидається разом і не знаєш, чи вивезеш ти це все...",

            "Але ти навіть не уявляєш, наскільки ти сильна.",

            "Твої батьки, брат, друзі, родичі і я — всі ми бачимо твою силу.",

            "Ми віримо в тебе, коли ти радієш, віримо, коли щось може не вдаватися, і підтримуємо, коли опускаються руки.",

            "Ми віримо в тебе завжди.",

            "Пишаємося тобою, пишаємося кожним твоїм досягненням, кожен день, кожну хвилину.)",

            "Цей міні-івент створено, щоб в усій цій життєвій рутині ти на секунду зупинилася, видихнула й посміхнулася, відкинувши весь негатив з голови."

        ];


        const lineTimings = [

            6100,
            7100,
            4500,
            6100,
            10100,
            4200,
            6000,
            7000

        ];


        let currentLine = 0;

        let paused = false;

        let lineTimer = null;

        let lineStartTime = 0;

        let remainingTime = 0;

        let finishStarted = false;

        let userIsScrolling = false;

        let scrollResumeTimer = null;


        function startText() {

            clearTimeout(
                lineTimer
            );


            currentLine = 0;

            paused = false;

            finishStarted = false;

            remainingTime = 0;

            lineStartTime = 0;

            userIsScrolling = false;


            clearTimeout(
                scrollResumeTimer
            );


            letter.scrollTop = 0;


            pauseButton.textContent =
                "⏸️ Пауза";


            textArea.innerHTML =
                "";


            photoContainer.classList.remove(
                "show"
            );


            finalMessage.classList.remove(
                "show"
            );


            controls.style.opacity =
                "1";


            controls.style.pointerEvents =
                "auto";


            setTimeout(
                () => {

                    if (!finishStarted) {

                        showCurrentLine();

                    }

                },
                2000
            );

        }


        letter.addEventListener(
            "scroll",
            function() {

                userIsScrolling = true;


                clearTimeout(
                    scrollResumeTimer
                );


                scrollResumeTimer =
                    setTimeout(
                        () => {

                            userIsScrolling =
                                false;

                        },
                        800
                    );

            },
            {
                passive: true
            }
        );


        function scrollToNewLine(
            element
        ) {

            if (userIsScrolling) {
                return;
            }


            setTimeout(
                () => {

                    if (userIsScrolling) {
                        return;
                    }


                    const letterRect =
                        letter.getBoundingClientRect();


                    const elementRect =
                        element.getBoundingClientRect();


                    const bottomPadding =
                        45;


                    const isBelow =
                        elementRect.bottom >
                        letterRect.bottom -
                        bottomPadding;


                    if (!isBelow) {
                        return;
                    }


                    const scrollAmount =
                        elementRect.bottom -
                        letterRect.bottom +
                        bottomPadding;


                    letter.scrollBy({

                        top:
                            scrollAmount,

                        behavior:
                            "smooth"

                    });

                },
                100
            );

        }


        function showCurrentLine() {

            clearTimeout(
                lineTimer
            );


            stopSound(
                "typingSound"
            );


            if (
                currentLine >=
                letterLines.length
            ) {

                finishText();

                return;

            }


            const text =
                letterLines[
                    currentLine
                ];


            const newLine =
                document.createElement(
                    "div"
                );


            newLine.className =
                "letter-line";


            newLine.textContent =
                text;


            textArea.appendChild(
                newLine
            );


            scrollToNewLine(
                newLine
            );


            requestAnimationFrame(
                () => {

                    newLine.classList.add(
                        "visible"
                    );

                }
            );


            playSound(
                "typingSound"
            );


            remainingTime =
                lineTimings[
                    currentLine
                ];


            lineStartTime =
                Date.now();


            lineTimer =
                setTimeout(
                    () => {

                        if (!paused) {

                            nextLine();

                        }

                    },
                    remainingTime
                );

        }


        function nextLine() {

            clearTimeout(
                lineTimer
            );


            if (
                currentLine >=
                letterLines.length
            ) {

                finishText();

                return;

            }


            currentLine++;


            if (
                currentLine >=
                letterLines.length
            ) {

                stopSound(
                    "typingSound"
                );


                finishText();

                return;

            }


            showCurrentLine();

        }


        function togglePause() {

            if (!paused) {

                paused = true;


                clearTimeout(
                    lineTimer
                );


                const elapsed =
                    Date.now() -
                    lineStartTime;


                remainingTime =
                    Math.max(
                        0,
                        remainingTime -
                        elapsed
                    );


                stopSound(
                    "typingSound"
                );


                pauseButton.textContent =
                    "▶️ Продовжити";

            } else {

                paused = false;


                pauseButton.textContent =
                    "⏸️ Пауза";


                lineStartTime =
                    Date.now();


                lineTimer =
                    setTimeout(
                        () => {

                            if (!paused) {

                                nextLine();

                            }

                        },
                        remainingTime
                    );


                playSound(
                    "typingSound"
                );

            }

        }


        function finishText() {

            if (finishStarted) {
                return;
            }


            finishStarted = true;


            clearTimeout(
                lineTimer
            );


            stopSound(
                "typingSound"
            );


            controls.style.opacity =
                "0";


            controls.style.pointerEvents =
                "none";


            setTimeout(
                () => {

                    showPhoto();

                },
                1200
            );

        }


        function showPhoto() {

            photoContainer.classList.add(
                "show"
            );


            playSound(
                "photoSound"
            );


            setTimeout(
                () => {

                    if (!userIsScrolling) {

                        photoContainer.scrollIntoView({

                            behavior:
                                "smooth",

                            block:
                                "center"

                        });

                    }

                },
                150
            );


            setTimeout(
                () => {

                    finalMessage.classList.add(
                        "show"
                    );


                    playSound(
                        "finalSound"
                    );


                    setTimeout(
                        () => {

                            if (!userIsScrolling) {

                                finalMessage.scrollIntoView({

                                    behavior:
                                        "smooth",

                                    block:
                                        "center"

                                });

                            }

                        },
                        100
                    );

                },
                900
            );

        }


        /* =====================================================
           SHAKE
        ===================================================== */

        const shakeStyle =
            document.createElement(
                "style"
            );


        shakeStyle.textContent = `

            @keyframes shake {

                0% {
                    transform:
                        translateX(0);
                }

                25% {
                    transform:
                        translateX(-8px);
                }

                50% {
                    transform:
                        translateX(8px);
                }

                75% {
                    transform:
                        translateX(-6px);
                }

                100% {
                    transform:
                        translateX(0);
                }

            }


            .shake {

                animation:
                    shake
                    0.4s
                    ease;

            }

        `;


        document.head.appendChild(
            shakeStyle
        );


        /* =====================================================
           PHOTO ERROR
        ===================================================== */

        const photo =
            document.querySelector(
                ".photo-frame img"
            );


        if (photo) {

            photo.addEventListener(
                "error",
                () => {

                    console.log(
                        "Файл meme.jpg не знайдено."
                    );

                }
            );

        }

    </script>

</body>

</html>
